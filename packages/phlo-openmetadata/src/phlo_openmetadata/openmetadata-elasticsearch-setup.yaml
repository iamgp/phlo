name: openmetadata-elasticsearch
description: OpenMetadata search backend
category: catalog
default: false
profile: openmetadata

image: phlo/openmetadata-elasticsearch:8.11.4-java-patches

build:
  context: .
  dockerfile: openmetadata-elasticsearch/Dockerfile

compose:
  restart: unless-stopped
  environment:
    discovery.type: single-node
    ES_JAVA_OPTS: ${OPENMETADATA_ES_JAVA_OPTS:--Xms256m -Xmx256m}
    xpack.security.enabled: "false"
  healthcheck:
    test:
      [
        "CMD",
        "sh",
        "-c",
        "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow'",
      ]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 120s

env_vars:
  OPENMETADATA_ES_JAVA_OPTS:
    default: "-Xms256m -Xmx256m"
    description: JVM heap settings for the bundled OpenMetadata Elasticsearch service

files:
  - source: es.Dockerfile
    dest: openmetadata-elasticsearch/Dockerfile
  - source: es-libraries.sha256
    dest: openmetadata-elasticsearch/libraries.sha256
