name: openmetadata-mysql
description: OpenMetadata MySQL datastore
category: catalog
default: false
profile: openmetadata

image: phlo/openmetadata-db:1.13.1-ol8.10
build:
  context: .
  dockerfile: openmetadata-mysql/Dockerfile

compose:
  restart: unless-stopped
  command: "--sort_buffer_size=10M"
  environment:
    MYSQL_ROOT_PASSWORD: ${OPENMETADATA_DB_ROOT_PASSWORD:-password}
  healthcheck:
    test:
      [
        "CMD",
        "mysqladmin",
        "ping",
        "--silent",
        "--host=127.0.0.1",
        "--user=root",
        "--password=$$MYSQL_ROOT_PASSWORD",
      ]
    interval: 15s
    timeout: 10s
    retries: 10

files:
  - source: db.Dockerfile
    dest: openmetadata-mysql/Dockerfile
