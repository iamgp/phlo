name: prometheus
description: Metrics collection and monitoring
category: observability
default: false
profile: observability

image: ${PROMETHEUS_IMAGE:-phlo/prometheus:v3.13.1-grpc1.82.1}
build:
  context: .
  dockerfile: prometheus/Dockerfile

compose:
  restart: unless-stopped
  user: "0"
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "prometheus:9090"
    phlo.metrics.path: "/metrics"
  command:
    - "--config.file=/etc/prometheus/prometheus.yml"
    - "--storage.tsdb.path=/prometheus"
    - "--web.enable-lifecycle"
    - "--storage.tsdb.retention.time=30d"
  ports:
    - "${PROMETHEUS_PORT:-9090}:9090"
  volumes:
    - ./prometheus:/etc/prometheus:ro
    - prometheus-data:/prometheus
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--quiet",
        "--tries=1",
        "--spider",
        "http://localhost:9090/-/healthy",
      ]
    interval: 10s
    timeout: 5s
    retries: 5

env_vars:
  PROMETHEUS_IMAGE:
    default: phlo/prometheus:v3.13.1-grpc1.82.1
    description: Pinned Prometheus image to build or run
  PROMETHEUS_VERSION:
    default: v3.13.1
    description: Prometheus version
  PROMETHEUS_PORT:
    default: 9090
    description: Prometheus web UI port
  PROMETHEUS_PUBLIC_URL:
    default: ""
    description: Public Prometheus base URL used by observability links
  PROMETHEUS_QUERY_PATH:
    default: "/graph"
    description: Path used to build Prometheus query links

files:
  - source: Dockerfile
    dest: prometheus/Dockerfile
  - source: prometheus.yml
    dest: prometheus/prometheus.yml
