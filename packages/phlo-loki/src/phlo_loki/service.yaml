name: loki
description: Log aggregation and querying
category: observability
default: false
profile: observability

image: ghcr.io/phlohouse/phlo-loki:3.7.4-grpc1.82.1-xtext0.39.0
build:
  context: .
  dockerfile: loki/Dockerfile

compose:
  restart: unless-stopped
  user: "0"
  labels:
    phlo.metrics.enabled: "true"
    phlo.metrics.port: "loki:3100"
    phlo.metrics.path: "/metrics"
  command: -config.file=/etc/loki/loki-config.yml
  ports:
    - "${LOKI_PORT:-3100}:3100"
  volumes:
    - ./loki:/etc/loki:ro
    - loki-data:/loki
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--quiet",
        "--tries=1",
        "--spider",
        "http://localhost:3100/ready",
      ]
    interval: 10s
    timeout: 5s
    retries: 5

env_vars:
  LOKI_PORT:
    default: 3100
    description: Loki API port
  LOKI_PUBLIC_URL:
    default: ""
    description: Public Loki base URL used by observability links
  LOKI_LOGS_PATH:
    default: "/logs"
    description: Path used to build Loki log query links

files:
  - source: Dockerfile
    dest: loki/Dockerfile
  - source: loki-config.yml
    dest: loki/loki-config.yml
