[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlo-dlt"
version = "0.1.1"
description = "DLT ingestion engine capability plugin for Phlo"
readme = {text = "DLT ingestion engine capability plugin for Phlo.", content-type = "text/plain"}
requires-python = ">=3.11"
authors = [
    {name = "Phlo Team", email = "team@phlo.dev"},
]
license = {text = "MIT"}
dependencies = [
    "phlo>=0.1.0",
    "dlt>=1.18.2",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "pyarrow>=21.0.0",
    "pyiceberg>=0.10.0",
    "python-ulid>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.entry-points."phlo.plugins.assets"]
dlt = "phlo_dlt.plugin:DltAssetProvider"

[project.entry-points."phlo.plugins.ingestion_providers"]
dlt = "phlo_dlt.plugin:DLTIngestionProvider"

[project.entry-points."phlo.plugins.cli"]
dlt = "phlo_dlt.cli_plugin:DltCliPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
