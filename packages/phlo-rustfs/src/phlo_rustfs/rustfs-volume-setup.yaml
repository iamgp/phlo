# Companion service for rustfs - prepares writable bind mount ownership
name: rustfs-volume-setup
description: Initialize RustFS data volume permissions
category: core
default: false

image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

compose:
  restart: "no"
  user: "0:0"
  entrypoint: /bin/sh
  command: >
    -c "
    mkdir -p /data &&
    chown -R 10001:10001 /data &&
    echo 'RustFS data volume ownership initialized'
    "
  volumes:
    - rustfs-data:/data
