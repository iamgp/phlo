[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phlo-lineage"
version = "0.1.0"
description = "Lineage tracking and visualization for Phlo"
readme = {text = "Lineage tracking and CLI for Phlo.", content-type = "text/plain"}
requires-python = ">=3.11"
authors = [
    {name = "Phlo Team", email = "team@phlo.dev"},
]
license = {text = "MIT"}
dependencies = [
    "phlo>=0.1.0",
    "psycopg2-binary>=2.9.11",
    "python-ulid>=2.0.0",
    "click>=8.3.0",
    "rich>=14.2.0",
]

[project.optional-dependencies]
observatory = [
    "phlo-observatory>=0.1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.entry-points."phlo.plugins.cli"]
lineage = "phlo_lineage.cli_plugin:LineageCliPlugin"

[project.entry-points."phlo.plugins.hooks"]
lineage = "phlo_lineage.hooks_plugin:LineageHookPlugin"

[project.entry-points."phlo.plugins.resources"]
lineage = "phlo_lineage.resource_provider:LineageResourceProvider"

[project.entry-points."phlo.plugins.observatory"]
lineage = "phlo_lineage.observatory_plugin:LineageObservatoryExtension"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phlo_lineage = [
    "sql/*.sql",
    "observatory_assets/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
