name: phlo-api-auth
description: Phlo API with oauth2-proxy forward-auth (use with proxy profile)
category: api
default: false
profile: api,proxy

compose:
    labels:
        traefik.http.routers.api.middlewares: "phlo-api-auth@docker"
        traefik.http.middlewares.phlo-api-auth.forwardauth.address: "http://oauth2-proxy:4180/oauth2/auth"
        traefik.http.middlewares.phlo-api-auth.forwardauth.trustForwardHeader: "true"
        traefik.http.middlewares.phlo-api-auth.forwardauth.authResponseHeaders: "X-Forwarded-User,X-Forwarded-Email,X-Forwarded-Groups"
