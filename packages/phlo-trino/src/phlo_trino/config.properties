coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Runtime WAP catalogs are provisioned by TrinoResource and retained only for
# their run. The generated compose directory keeps the owned catalog files so
# explicit WAP cleanup can remove the exact catalog after it is no longer used.
catalog.management=dynamic

query.max-memory-per-node=256MB
memory.heap-headroom-per-node=256MB

task.max-writer-count=1
task.concurrency=1

spill-enabled=true
spiller-spill-path=/tmp/trino-spill
