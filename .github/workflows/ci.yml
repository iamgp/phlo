name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        id: ruff_lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cairn-artifacts

          set +e
          uv run ruff check . --output-format json --output-file cairn-artifacts/ruff-results.json
          ruff_exit=$?
          set -e

          if [ ! -f cairn-artifacts/ruff-results.json ]; then
            echo "[]" > cairn-artifacts/ruff-results.json
          fi

          echo "ruff_exit=${ruff_exit}" >> "$GITHUB_OUTPUT"
          if [ "${ruff_exit}" -ne 0 ]; then
            exit "${ruff_exit}"
          fi

      - name: Check formatting
        id: ruff_format
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cairn-artifacts

          set +e
          uv run ruff format --check .
          format_exit=$?
          set -e

          if [ "${format_exit}" -eq 0 ]; then
            status="pass"
          else
            status="fail"
          fi

          cat > cairn-artifacts/ruff-format-summary.json <<EOF
          {
            "summary": {"status": "${status}", "duration_seconds": 0},
            "results": [
              {
                "id": "ruff-format",
                "status": "${status}",
                "duration_seconds": 0,
                "message": "ruff format --check exit ${format_exit}"
              }
            ]
          }
          EOF

          echo "format_exit=${format_exit}" >> "$GITHUB_OUTPUT"
          if [ "${format_exit}" -ne 0 ]; then
            exit "${format_exit}"
          fi

      - name: Upload Cairn lint artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cairn-lint
          path: cairn-artifacts/
          if-no-files-found: warn

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check with ty
        run: make typecheck-python

  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run core regression suite
        run: make test-core-regression

      - name: Run tests
        id: core_tests
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SUPERSET_ADMIN_PASSWORD: ${{ secrets.SUPERSET_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p cairn-artifacts
          junit_path="cairn-artifacts/pytest-${{ matrix.python-version }}.xml"

          set +e
          uv run pytest tests -m "not integration" --tb=short --cov=phlo --cov-report=term-missing --junitxml "${junit_path}"
          pytest_exit=$?
          set -e

          if [ ! -f "${junit_path}" ]; then
            printf '%s\n' \
              '<testsuite name="pytest" tests="0" failures="0" errors="1" skipped="0">' \
              '  <testcase classname="cairn" name="pytest-missing-output">' \
              '    <error message="pytest did not produce junit xml output"/>' \
              '  </testcase>' \
              '</testsuite>' > "${junit_path}"
          fi

          echo "pytest_exit=${pytest_exit}" >> "$GITHUB_OUTPUT"
          exit "${pytest_exit}"

      - name: Upload Cairn core test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cairn-test-core-${{ matrix.python-version }}
          path: cairn-artifacts/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn

  test-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: phlo-alerting
            extra: ""
          - package: phlo-alloy
            extra: ""
          - package: phlo-api
            extra: ""
          - package: phlo-core-plugins
            extra: ""
          - package: phlo-dagster
            extra: ""
          - package: phlo-dbt
            extra: ""
          - package: phlo-delta
            extra: ""
          - package: phlo-dlt
            extra: ""
          - package: phlo-grafana
            extra: ""
          - package: phlo-hasura
            extra: ""
          - package: phlo-iceberg
            extra: ""
          - package: phlo-lineage
            extra: ""
          - package: phlo-loki
            extra: ""
          - package: phlo-minio
            extra: ""
          - package: phlo-nessie
            extra: ""
          - package: phlo-observatory
            extra: ""
          - package: phlo-observatory-example
            extra: ""
          - package: phlo-openmetadata
            extra: ""
          - package: phlo-otel
            extra: ""
          - package: phlo-pgweb
            extra: ""
          - package: phlo-postgres
            extra: ""
          - package: phlo-postgrest
            extra: ""
          - package: phlo-prometheus
            extra: ""
          - package: phlo-pandera
            extra: ""
          - package: phlo-superset
            extra: ""
          - package: phlo-testing
            extra: ""
          - package: phlo-trino
            extra: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run package tests
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SUPERSET_ADMIN_PASSWORD: ${{ secrets.SUPERSET_ADMIN_PASSWORD }}
        run: |
          set +e
          run_args=(--package "${{ matrix.package }}" --with pytest)
          if [ -n "${{ matrix.extra }}" ]; then
            run_args+=(--extra "${{ matrix.extra }}")
          fi
          uv run "${run_args[@]}" \
            pytest -m "not integration" --tb=short "packages/${{ matrix.package }}/tests"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then
            echo "No tests selected for ${{ matrix.package }} under marker filter; skipping."
            exit 0
          fi
          exit "$exit_code"

  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint SQL with sqlfluff
        run: |
          if [ -d "workflows/transforms/dbt" ]; then
            uv run sqlfluff lint workflows/transforms/dbt
          else
            echo "Skipping sqlfluff: no workflows/transforms/dbt directory."
          fi

  lint-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npx eslint src --ext .ts,.tsx

  type-check-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check with TypeScript
        run: npx tsc --noEmit

  format-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npx prettier --check .

  test-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  cairn:
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    needs:
      - lint
      - test-core
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Download Cairn artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: cairn-*
          merge-multiple: true
          path: cairn-artifacts

      - name: Publish Cairn report
        uses: iamgp/cairn@90c816cc3386b98205f5f213e5589a80ba999008 # v0.2.1
        with:
          collect-config: .github/cairn.toml
          pages-subdir: ${{ github.event_name == 'pull_request' && format('previews/pr-{0}/cairn', github.event.pull_request.number) || 'cairn' }}
          deploy-pages: "false"
