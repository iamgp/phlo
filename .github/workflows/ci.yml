name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check with ty
        run: make typecheck-python

  test-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run core regression suite
        run: make test-core-regression

      - name: Run tests
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SUPERSET_ADMIN_PASSWORD: ${{ secrets.SUPERSET_ADMIN_PASSWORD }}
        run: |
          uv run pytest tests -m "not integration" --tb=short --cov=phlo --cov-report=term-missing

  test-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: phlo-alerting
            extra: ""
          - package: phlo-alloy
            extra: ""
          - package: phlo-api
            extra: ""
          - package: phlo-core-plugins
            extra: ""
          - package: phlo-dagster
            extra: ""
          - package: phlo-dbt
            extra: ""
          - package: phlo-dlt
            extra: ""
          - package: phlo-grafana
            extra: ""
          - package: phlo-hasura
            extra: ""
          - package: phlo-iceberg
            extra: ""
          - package: phlo-lineage
            extra: ""
          - package: phlo-loki
            extra: ""
          - package: phlo-metrics
            extra: ""
          - package: phlo-minio
            extra: ""
          - package: phlo-nessie
            extra: ""
          - package: phlo-observatory
            extra: ""
          - package: phlo-observatory-example
            extra: ""
          - package: phlo-openmetadata
            extra: ""
          - package: phlo-pgweb
            extra: ""
          - package: phlo-postgres
            extra: ""
          - package: phlo-postgrest
            extra: ""
          - package: phlo-prometheus
            extra: ""
          - package: phlo-quality
            extra: ""
          - package: phlo-superset
            extra: ""
          - package: phlo-testing
            extra: ""
          - package: phlo-trino
            extra: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run package tests
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SUPERSET_ADMIN_PASSWORD: ${{ secrets.SUPERSET_ADMIN_PASSWORD }}
        run: |
          set +e
          run_args=(--package "${{ matrix.package }}" --with pytest)
          if [ -n "${{ matrix.extra }}" ]; then
            run_args+=(--extra "${{ matrix.extra }}")
          fi
          uv run "${run_args[@]}" \
            pytest -m "not integration" --tb=short "packages/${{ matrix.package }}/tests"
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then
            echo "No tests selected for ${{ matrix.package }} under marker filter; skipping."
            exit 0
          fi
          exit "$exit_code"

  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint SQL with sqlfluff
        run: |
          if [ -d "workflows/transforms/dbt" ]; then
            uv run sqlfluff lint workflows/transforms/dbt
          else
            echo "Skipping sqlfluff: no workflows/transforms/dbt directory."
          fi

  lint-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npx eslint src --ext .ts,.tsx

  type-check-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check with TypeScript
        run: npx tsc --noEmit

  format-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npx prettier --check .

  test-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
