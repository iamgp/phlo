name: Security

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-dependencies:
    name: security / python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.10.10"

      - name: Audit Python dependencies
        shell: bash
        run: uv --preview-features audit-command audit --locked

  observatory-dependencies:
    name: security / observatory dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/phlo-observatory/src/phlo_observatory
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/phlo-observatory/src/phlo_observatory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit Observatory dependencies
        run: npm audit --audit-level=high

  docs-dependencies:
    name: security / docs site generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "0.10.10"

      - name: Install pymdx
        run: uv tool install "pymdx==0.1.4"

      - name: Generate docs site
        run: pymdx generate src/phlo --docs docs --output docs-site

      - name: Build docs site
        run: pymdx build docs-site
