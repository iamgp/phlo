name: Docs

on:
  push:
    branches: [main]
    paths:
      - "src/phlo/**"
      - "packages/**"
      - "docs/**"
      - "pymdx.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYMDX_VERSION: "0.1.3"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Cache pymdx binary
        id: cache-pymdx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/pymdx
          key: pymdx-${{ env.PYMDX_VERSION }}-linux-x86_64

      - name: Install pymdx
        if: steps.cache-pymdx.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/iamgp/pymdx/releases/download/v${PYMDX_VERSION}/pymdx-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pymdx/bun
          key: pymdx-bun-${{ hashFiles('pymdx.toml') }}

      - name: Generate docs site
        run: pymdx generate src/phlo --docs docs --output docs-site

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docs-site/node_modules
          key: docs-node-modules-${{ hashFiles('docs-site/package.json') }}

      - name: Build static site
        run: pymdx build docs-site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/out
