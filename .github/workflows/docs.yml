name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@0f02c547dbf1c7b6cb3329322436c6e7b4dc4197
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-app/package-lock.json
      - name: Install docs app dependencies
        working-directory: docs-app
        run: npm ci
      - name: Build docs
        working-directory: docs-app
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@0f02c547dbf1c7b6cb3329322436c6e7b4dc4197
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-app/package-lock.json
      - name: Install docs app dependencies
        working-directory: docs-app
        run: npm ci
      - name: Build docs
        working-directory: docs-app
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-app/out
          keep_files: true
