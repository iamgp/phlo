name: Docs

on:
  push:
    branches: [main]
    paths:
      - "src/phlo/**"
      - "packages/**"
      - "docs/**"
      - "pymdx.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYMDX_VERSION: "0.1.4"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-writers
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Install pymdx
        run: uv tool install "pymdx==${PYMDX_VERSION}"

      - name: Cache bun
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pymdx/bun
          key: pymdx-bun-${{ hashFiles('pymdx.toml') }}

      - name: Generate docs site
        run: pymdx generate src/phlo --docs docs --output docs-site

      - name: Set base path
        run: |
          sed -i 's|output: "export",|output: "export",\n  basePath: "/phlo",|' docs-site/next.config.mjs

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docs-site/node_modules
          key: docs-node-modules-${{ env.PYMDX_VERSION }}-${{ hashFiles('pymdx.toml') }}

      - name: Build static site
        run: pymdx build docs-site

      - name: Preserve cairn reports
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- cairn previews 2>/dev/null || true
          cp -r cairn docs-site/out/cairn 2>/dev/null || true
          cp -r previews docs-site/out/previews 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/out
