name: Publish Packages

on:
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: string
        default: "false"
      publish_all:
        required: false
        type: string
        default: "false"
      packages:
        required: false
        type: string
        default: ""
      base_ref:
        required: false
        type: string
        default: ""
      current_tag:
        required: false
        type: string
        default: ""
    secrets:
      PYPI_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine packages to publish
        id: plan
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CURRENT_TAG: ${{ inputs.current_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_ALL: ${{ inputs.publish_all }}
          TARGET_PACKAGES: ${{ inputs.packages }}
        run: python .github/scripts/publish_plan.py

      - name: Log publish plan
        env:
          DRY_RUN_OUTPUT: ${{ steps.plan.outputs.dry_run }}
          PACKAGES_JSON: ${{ steps.plan.outputs.packages }}
        run: |
          echo "Dry run: $DRY_RUN_OUTPUT"
          echo "Packages: $PACKAGES_JSON"

  build:
    needs: plan
    if: needs.plan.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build packages
        env:
          PACKAGES_JSON: ${{ needs.plan.outputs.packages }}
        run: |
          rm -rf dist
          mkdir -p dist
          printf '%s\n' "$PACKAGES_JSON" > /tmp/packages.json
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          packages = json.loads(pathlib.Path("/tmp/packages.json").read_text(encoding="utf-8"))
          if not packages:
              raise SystemExit("No packages selected for build.")
          for package in packages:
              subprocess.check_call(["uv", "build", "--package", package, "--out-dir", "dist"])
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dist
          path: dist/

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.has_packages == 'true' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (API token)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: dist
          password: ${{ env.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

      - name: Publish to PyPI (trusted publisher)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: dist
          skip-existing: true
          verbose: true
