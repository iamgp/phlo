name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish or recover, for example `v0.7.9`
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-pr:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'build:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'test:')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"
          enable-cache: false

      - uses: iamgp/ReleaseX@65c40c6bb71f99ce60cbc607e2f611711895b802
        with:
          command: release pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"
          enable-cache: false

      - uses: iamgp/ReleaseX@65c40c6bb71f99ce60cbc607e2f611711895b802
        with:
          command: release tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Resolve publish ref
        id: publish-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_GITHUB_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag_input="$INPUT_TAG"
            case "$tag_input" in
              v*) ;;
              *) tag_input="v$tag_input" ;;
            esac
            ref="refs/tags/$tag_input"
          else
            ref="$PUBLISH_GITHUB_REF"
          fi

          case "$ref" in
            refs/tags/v*) ;;
            *)
              echo "::error::Publish ref must be a version tag like refs/tags/v0.7.9"
              exit 1
              ;;
          esac

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.publish-ref.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Build packages
        run: |
          repo_root="$PWD"
          rm -rf dist
          uv build --out-dir "$repo_root/dist"
          for pkg in packages/*/; do
            package_dist="$repo_root/${pkg%/}/dist"
            rm -rf "$package_dist"
            uv build --directory "$pkg" --out-dir "$package_dist"
          done

      - uses: iamgp/ReleaseX@65c40c6bb71f99ce60cbc607e2f611711895b802
        with:
          command: release publish --skip-published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
