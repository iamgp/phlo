name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-pr:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'build:') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'test:')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"
          enable-cache: false

      - uses: iamgp/ReleaseX@81af2b33865d393c0afa339a71a8b0b98aff0951
        with:
          command: release pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"
          enable-cache: false

      - uses: iamgp/ReleaseX@81af2b33865d393c0afa339a71a8b0b98aff0951
        with:
          command: release tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Build packages
        run: |
          repo_root="$PWD"
          rm -rf dist
          uv build --out-dir "$repo_root/dist"
          for pkg in packages/*/; do
            package_dist="$repo_root/${pkg%/}/dist"
            rm -rf "$package_dist"
            uv build --directory "$pkg" --out-dir "$package_dist"
          done

      - name: Remove already-published artifacts
        run: |
          python3 - <<'PY'
          import email
          import json
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          def artifact_metadata(path: Path) -> tuple[str, str]:
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as wheel:
                      metadata_name = next(
                          name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
                      )
                      payload = wheel.read(metadata_name).decode("utf-8")
              elif path.suffixes[-2:] == [".tar", ".gz"]:
                  with tarfile.open(path, "r:gz") as sdist:
                      member = next(
                          member
                          for member in sdist.getmembers()
                          if member.name.endswith("/PKG-INFO")
                      )
                      extracted = sdist.extractfile(member)
                      if extracted is None:
                          raise RuntimeError(f"failed to extract PKG-INFO from {path}")
                      payload = extracted.read().decode("utf-8")
              else:
                  raise RuntimeError(f"unsupported artifact type: {path}")

              message = email.message_from_string(payload)
              name = message["Name"]
              version = message["Version"]
              if not name or not version:
                  raise RuntimeError(f"missing Name/Version metadata in {path}")
              return name, version

          def published(name: str, version: str) -> bool:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=20) as response:
                  payload = json.load(response)
              return bool(payload.get("releases", {}).get(version))

          dist_dirs = [Path("dist"), *sorted(Path("packages").glob("*/dist"))]
          removed = []
          kept = []

          for dist_dir in dist_dirs:
              if not dist_dir.exists():
                  continue
              for artifact in sorted(path for path in dist_dir.iterdir() if path.is_file() and path.name != ".gitignore"):
                  name, version = artifact_metadata(artifact)
                  if published(name, version):
                      artifact.unlink()
                      removed.append(f"{artifact} ({name} {version})")
                  else:
                      kept.append(f"{artifact} ({name} {version})")

          print("Removed already-published artifacts:")
          for item in removed:
              print(f"- {item}")
          print("Kept unpublished artifacts:")
          for item in kept:
              print(f"- {item}")
          PY

      - uses: iamgp/ReleaseX@81af2b33865d393c0afa339a71a8b0b98aff0951
        with:
          command: release publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
