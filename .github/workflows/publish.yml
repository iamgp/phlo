name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build packages but skip publishing to PyPI"
        required: false
        default: "false"
      publish_all:
        description: "Publish all workspace packages (ignore change detection)"
        required: false
        default: "false"
      packages:
        description: "Comma-separated package names or JSON list to publish (overrides detection/publish_all)"
        required: false
        default: ""
      base_ref:
        description: "Git ref to compare against for change detection (defaults to previous tag)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-packages.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      publish_all: ${{ inputs.publish_all }}
      packages: ${{ inputs.packages }}
      base_ref: ${{ inputs.base_ref }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
