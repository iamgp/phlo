[project]
name = "phlo"
repo_url = "https://github.com/phlohouse/phlo"

[history]
max_days = 180
max_runs = 400

[pr_comment]
enabled = true
show_coverage = false
show_per_matrix = true

[[checkers]]
id = "ruff"
adapter = "ruff_json"
input = "cairn-artifacts/ruff-results.json"

[[checkers]]
id = "ruff-format"
adapter = "generic_json"
input = "cairn-artifacts/ruff-format-summary.json"

[checkers.mapping]
status = "summary.status"
duration_s = "summary.duration_seconds"
items = "results"

[checkers.mapping.item]
id = "id"
status = "status"
duration_s = "duration_seconds"
message = "message"

[[checkers]]
id = "pytest-3.11"
adapter = "junit_xml"
input = "cairn-artifacts/pytest-3.11.xml"

[[checkers]]
id = "pytest-3.12"
adapter = "junit_xml"
input = "cairn-artifacts/pytest-3.12.xml"
