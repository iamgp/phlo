[project]
name = "Phlo"
version = "0.1.0"
repo = "https://github.com/phlohouse/phlo"
description = "Phlo is a modular lakehouse platform for ingestion, quality, transformation, orchestration, and data access."

[source]
packages = ["src/phlo"]
docs = ["docs"]
docstring_style = "google"
include_private = false
include_dunder = false
exclude = [
  "**/test_*.py",
  "**/tests/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/.DS_Store",
  "assets/**",
]

[output]
dir = "docs-site"
base_path = "/phlo"

[theme]
primary_color = "#2563eb"

[[nav.links]]
label = "GitHub"
url = "https://github.com/phlohouse/phlo"
